// OpenMOHAA Plus reference match settings (example league config): exec plus-match.cfg
set g_gametype 4                    // objective
set roundlimit 3                    // minutes per round
set timelimit 0
set g_forceready 0                  // players type "ready" before the first round
set g_teamdamage 1
set sv_scripts "global/plus/match.scr"
set plus_match_rounds 12            // first to 7 wins; sides switch after 6
set plus_match_timeouts 1           // per team and half
set plus_match_timeout_length 60    // seconds
