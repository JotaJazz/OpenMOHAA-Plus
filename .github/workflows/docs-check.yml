name: Docs check

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'LAYOUT.md'
      - 'docs/dev/**'
      - 'docs/ai/**'
      - 'misc/docs-check/**'
      - 'tests/**'
      - 'misc/scr-tools/**'
      - 'misc/i18n/**'
      - 'misc/fonts/**'
      - '.github/workflows/docs-check.yml'
      - 'code/**'
      - 'cmake/**'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'LAYOUT.md'
      - 'docs/dev/**'
      - 'docs/ai/**'
      - 'misc/docs-check/**'
      - 'tests/**'
      - '.github/workflows/docs-check.yml'
      - 'code/**'
      - 'cmake/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checker unit tests
        run: python3 -I -m unittest discover -s misc/docs-check -v

      - name: Game test suite imports (tests skip without game data)
        run: python3 -I -m unittest discover -s tests -v

      - name: Script tools tests (engine tests skip without game data)
        run: python3 -I -m unittest discover -s misc/scr-tools -v

      - name: Translation tool tests
        run: python3 -I -m unittest discover -s misc/i18n -v

      - name: Font tool tests (skip without Pillow)
        run: python3 -m unittest discover -s misc/fonts -v

      - name: Check docs
        run: python3 -I misc/docs-check/check_docs.py
