name: "Builds"

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Changed in OpenMOHAA Plus: the platforms are separate jobs, so that a macOS runner shortage
  # (GitHub could not assign one for hours on 2026-11-12) does not hold back the Linux and Windows
  # pre-release. Tagged releases (tags-publish-release.yml) still need every platform.
  build-platform-linux:
    uses: ./.github/workflows/shared-build-linux.yml
    with:
      environment: 'testing'

  build-platform-windows:
    uses: ./.github/workflows/shared-build-windows.yml
    with:
      environment: 'testing'

  build-platform-macos:
    uses: ./.github/workflows/shared-build-macos.yml
    with:
      environment: 'testing'

  # Initially create a release with 1 job
  # so multiple files can be uploaded at the same time afterwards
  create-release:
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref_name == 'main'
      && needs.build-platform-linux.result == 'success' && needs.build-platform-windows.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: 'testing'
    needs: [build-platform-linux, build-platform-windows, build-platform-macos]

    steps:
    - name: Release
      uses: softprops/action-gh-release@v2.3.2
      with:
        prerelease: true
        name: '${{github.ref_name}}-${{github.sha}}'
        tag_name: 'dev'

  deploy-release:
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        target_os: [
          'linux-amd64',
          'linux-amd64-appimage',
          'linux-arm64-appimage',
          'fonts',
          'linux-i686',
          'linux-arm64',
          'linux-armhf',
          'linux-powerpc',
          'linux-ppc64',
          'linux-ppc64el',
          'windows-x64-pdb',
          'windows-x86-pdb',
          'windows-arm64-pdb',
          'macos-multiarch-arm64-x86_64',
        ]

    runs-on: ubuntu-24.04
    environment: 'testing'
    needs: [create-release, build-platform-macos]

    env:
      RELEASE_NAME: ${{github.event.repository.name}}-dev-${{matrix.target_os}}
      # Added in OpenMOHAA Plus: the macOS archive only when its build succeeded (the previous one stays)
      PUBLISH: ${{ matrix.target_os != 'macos-multiarch-arm64-x86_64' || needs.build-platform-macos.result == 'success' }}

    steps:
    - uses: actions/download-artifact@v4
      if: ${{ env.PUBLISH == 'true' }}
      with:
        name: 'out-${{matrix.target_os}}'
        path: ${{github.workspace}}/${{matrix.target_os}}

    - name: Zip
      if: ${{ env.PUBLISH == 'true' && !endsWith(matrix.target_os, '-appimage') && matrix.target_os != 'fonts' }}
      working-directory: '${{github.workspace}}/${{matrix.target_os}}'
      run: zip -9 -r "../${{env.RELEASE_NAME}}.zip" ./

    - name: Release
      if: ${{ env.PUBLISH == 'true' && !endsWith(matrix.target_os, '-appimage') && matrix.target_os != 'fonts' }}
      uses: softprops/action-gh-release@v2.3.2
      with:
        tag_name: 'dev'
        files: ${{github.workspace}}/${{env.RELEASE_NAME}}.zip

    # Added in OpenMOHAA Plus: AppImages are published as they are
    - name: Release AppImage
      if: ${{ endsWith(matrix.target_os, '-appimage') }}
      uses: softprops/action-gh-release@v2.3.2
      with:
        tag_name: 'dev'
        files: ${{github.workspace}}/${{matrix.target_os}}/*.AppImage

    - name: Release fonts
      if: ${{ matrix.target_os == 'fonts' }}
      uses: softprops/action-gh-release@v2.3.2
      with:
        tag_name: 'dev'
        files: ${{github.workspace}}/${{matrix.target_os}}/*.pk3
